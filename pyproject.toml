[project]
name = "mail-triage-agent"
version = "0.1.0"
description = "Filters incoming email by sender/keyword, analyzes it with Claude, and prepares reply drafts for you to review and send."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
mail-triage-agent = "mail_triage_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
